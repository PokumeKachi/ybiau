<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />

        <title>ybiau</title>

        <style>
            html,
            body {
                margin: 0;
                background: #eee;
            }

            #pdf {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                padding: 0;
            }

            canvas {
                display: block;
                max-width: 100%;
                height: auto;
                background: white;
            }
        </style>
    </head>

    <body>
        <main id="pdf"></main>
        <script type="module" src="/analytics.js"></script>
        <script type="module">
            import {
                getDocument,
                GlobalWorkerOptions,
            } from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs";

            GlobalWorkerOptions.workerSrc =
                "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs";

            const response = await fetch("/main.pdf");

            if (!response.ok) {
                throw new Error(`Failed to fetch PDF: ${response.status}`);
            }

            const data = await response.arrayBuffer();
            const pdf = await getDocument({ data }).promise;

            const container = document.querySelector("#pdf");

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);

                const viewport = page.getViewport({
                    scale: 1.5,
                });

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                container.appendChild(canvas);

                await page.render({
                    canvasContext: context,
                    viewport,
                }).promise;
            }
        </script>
    </body>
</html>
